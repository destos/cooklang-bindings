[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cooklang-bindings"
version = "0.2.0"
description = "Python bindings for cooklang-rs, the official Cooklang parser"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
keywords = ["cooklang", "recipe", "parser", "uniffi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: Markup",
]

[project.urls]
Upstream = "https://github.com/cooklang/cooklang-rs"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = { "" = "src" }
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cooklang = ["py.typed"]
"cooklang._generated" = ["*.py", "*.so", "*.dylib", "*.dll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
