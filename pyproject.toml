[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cooklang-bindings"
version = "0.3.0"
description = "Python bindings for cooklang-rs, the official Cooklang parser"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
keywords = ["cooklang", "recipe", "parser", "uniffi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: Markup",
]

[project.urls]
Homepage = "https://github.com/destos/cooklang-bindings"
Repository = "https://github.com/destos/cooklang-bindings"
Documentation = "https://cooklang-bindings.readthedocs.io/"
Issues = "https://github.com/destos/cooklang-bindings/issues"
Upstream = "https://github.com/cooklang/cooklang-rs"

[project.optional-dependencies]
test = ["pytest>=8"]
# Documentation toolchain. Mirrored in docs/requirements.txt, which is what
# Read the Docs installs. mkdocs is pinned below 2.0 because MkDocs 2.0
# removes the plugin system that mkdocstrings and Material both rely on.
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.26",
    # Lets mkdocstrings format rendered signatures.
    "ruff>=0.6",
]

[tool.setuptools]
package-dir = { "" = "src" }
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cooklang = ["py.typed"]
"cooklang._generated" = ["*.py", "*.so", "*.dylib", "*.dll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `--doctest-modules` makes pytest import every module under the paths it is
# given, and docs/_extensions holds a Griffe plugin that only the docs
# toolchain installs. It is build tooling, not a module to doctest.
norecursedirs = ["_extensions", "build", "vendor", ".venv", "*.egg"]
