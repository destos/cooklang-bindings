name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Lets the release workflow gate publishing on the test suite.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: tests + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vendor/cooklang-rs/target
          key: cargo-test-${{ hashFiles('vendor/cooklang-rs/Cargo.lock', '.gitmodules') }}

      - name: Generate bindings
        run: python scripts/generate.py

      - name: Run tests and doctest the documentation
        run: |
          uv venv
          uv pip install pytest build
          PYTHONPATH=src .venv/bin/python -m pytest tests --doctest-glob='*.md' docs \
            --doctest-modules src/cooklang -q

      - name: Build the docs
        run: make docs

      - name: Build a wheel for the interpreter matrix
        run: .venv/bin/python -m build --wheel

      - uses: actions/upload-artifact@v7
        with:
          name: test-wheel
          path: dist/*.whl

  # The wheel carries no Python ABI tag -- UniFFI's Python output uses ctypes,
  # not the CPython C API -- so one wheel is meant to serve every supported
  # interpreter. This job is what makes that a tested claim rather than a
  # stated one: it installs the single wheel built above on each version.
  wheel-matrix:
    name: wheel on Python ${{ matrix.python-version }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v8
        with:
          name: test-wheel
          path: dist

      - name: Install the wheel and run the suite against it
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl pytest
          cd /tmp && python -m pytest "$GITHUB_WORKSPACE/tests" -q
