name: Wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # Lets the release workflow build the very same wheels this workflow tests,
  # rather than keeping a second copy of the build that can drift from it.
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  # The dylib's real minimum, per `otool -l`. Without this the wheel inherits
  # the runner Python's SDK version and refuses to install on older macOS.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  linux:
    # Native runners for both arches -- GitHub provides free arm64 runners to
    # public repositories, so this needs no QEMU and costs roughly the same
    # wall-clock as the x86_64 job. Emulated arm64 builds of this crate take
    # minutes rather than seconds, so avoid falling back to QEMU if possible.
    name: linux ${{ matrix.arch }} (manylinux)
    runs-on: ${{ matrix.runner }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vendor/cooklang-rs/target
          key: cargo-manylinux-${{ matrix.arch }}-${{ hashFiles('vendor/cooklang-rs/Cargo.lock', '.gitmodules') }}

      - name: Generate bindings
        run: /opt/python/cp314-cp314/bin/python scripts/generate.py

      - name: Build wheel
        run: |
          /opt/python/cp314-cp314/bin/python -m pip install --upgrade build auditwheel
          /opt/python/cp314-cp314/bin/python -m build --wheel
          auditwheel repair dist/*.whl -w wheelhouse/

      - name: Test the built wheel
        run: |
          /opt/python/cp314-cp314/bin/python -m pip install wheelhouse/*.whl pytest
          cd /tmp && /opt/python/cp314-cp314/bin/python -m pytest "$GITHUB_WORKSPACE/tests" -q

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-linux-${{ matrix.arch }}
          path: wheelhouse/*.whl

  macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vendor/cooklang-rs/target
          key: cargo-macos-${{ hashFiles('vendor/cooklang-rs/Cargo.lock', '.gitmodules') }}

      - name: Generate bindings
        run: python scripts/generate.py

      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel

      - name: Test the built wheel
        run: |
          python -m pip install dist/*.whl pytest
          cd /tmp && python -m pytest "$GITHUB_WORKSPACE/tests" -q

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-macos-arm64
          path: dist/*.whl

  # Guards the layer that the wheels cannot: that the pinned submodule is the
  # version the package claims, so a bumped submodule cannot ship silently.
  check-pin:
    name: upstream pin matches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Submodule commit matches UPSTREAM_VERSION
        run: |
          # `git describe` is not usable here: actions/checkout fetches
          # submodules without tags, so there is nothing to describe. Resolve
          # the tag on the remote instead and compare commit SHAs.
          declared=$(grep -oE '^UPSTREAM_VERSION = "[^"]+"' src/cooklang/__init__.py | cut -d'"' -f2)
          remote=https://github.com/cooklang/cooklang-rs
          # ^{} dereferences an annotated tag to the commit it points at; fall
          # back to the ref itself for a lightweight tag.
          expected=$(git ls-remote "$remote" "refs/tags/v$declared^{}" | cut -f1)
          if [ -z "$expected" ]; then
            expected=$(git ls-remote "$remote" "refs/tags/v$declared" | cut -f1)
          fi
          actual=$(git -C vendor/cooklang-rs rev-parse HEAD)
          echo "declared=v$declared"
          echo "expected=$expected"
          echo "actual  =$actual"
          if [ -z "$expected" ]; then
            echo "::error::no tag v$declared on $remote"
            exit 1
          fi
          test "$expected" = "$actual"
