# Read the Docs build configuration.
# https://docs.readthedocs.com/platform/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

mkdocs:
  configuration: mkdocs.yml
  # Equivalent to `mkdocs build --strict`, which is what `make docs` and CI
  # run. Without it a broken cross-reference would publish silently.
  fail_on_warning: true

# Only the documentation toolchain is installed. The `cooklang` package itself
# is deliberately NOT installed here: its build compiles a Rust cdylib and runs
# uniffi-bindgen, and Read the Docs has no Rust toolchain.
#
# mkdocstrings does not need it. Griffe analyses `src/cooklang` statically,
# without importing it, so the API reference builds from source alone -- no
# compiled library required. See docs/contributing.md.
python:
  install:
    - requirements: docs/requirements.txt
