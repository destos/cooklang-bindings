# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    build:
      html:
        - mkdocs build --strict --site-dir $READTHEDOCS_OUTPUT/html

mkdocs:
  configuration: mkdocs.yml

# Only the docs toolchain is installed. The `cooklang` package itself is
# deliberately NOT installed here: its build compiles a Rust cdylib and runs
# uniffi-bindgen, which Read the Docs has no toolchain for. mkdocstrings does
# not need it -- Griffe analyses `src/cooklang` statically, without importing
# it. See docs/contributing.md for the full explanation.
python:
  install:
    - requirements: docs/requirements.txt
